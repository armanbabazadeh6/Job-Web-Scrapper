# Remote job boards. RemoteOK needs no setup; WWR entries are category
# slugs from weworkremotely.com/categories/<slug>.
remote_boards:
  remoteok: true
  weworkremotely:
    - remote-programming-jobs

# Workday-hosted boards (real JSON API). PwC is the one big consulting firm
# whose board still works — Deloitte, EY, Accenture, KPMG, and Slalom all
# gate their endpoints (422/401).
#
# PwC is keyword-gated on purpose: no default_role_category and no
# finance_titles, so only titles matching our role keywords (e.g.
# "Technology Consultant") pass — tax/audit/assurance roles on the same
# board are ignored.
#
# To find values for a new company: open their careers page, copy the URL —
# first subdomain is `base` host, the path segment after the locale (e.g.
# en-US) is `site`. Example:
#   https://jpmc.wd5.myworkdayjobs.com/en-US/ExternalCareerSite/
#                ↑─────────── base ───────────↑    ↑── site ──↑
workday_boards:
  - name: PwC (Campus)
    base: https://pwc.wd3.myworkdayjobs.com
    site: Global_Campus_Careers

# Arbitrary career pages to grep for matching links (best-effort; JS-only
# pages return nothing). Currently empty — same narrowing as workday_boards.
watch_urls: []

# Skip a new posting when the same company+role was announced within this
# many days (catches the same job arriving via a community list AND a
# company board — two links, one job). 0 disables.
dedup_days: 3

# Companies that get a ⭐ prefix on pings (substring match, case-insensitive).
# Example: [stripe, openai, anthropic]
favorite_companies: []

# Candidate profile — the LLM verifier reads this to score fit 1-5 per
# posting. Timing alone works; skills and preferences sharpen it.
profile:
  graduation: "December 2026"
  available_from: "January 2027"
  skills: []          # e.g. [python, react, sql, java]
  preferences: []     # e.g. [backend, infrastructure, fintech]
  dealbreakers: []    # e.g. [weekly on-call, relocation required]

# Postings requiring a security clearance get an 🔐 tag. Set true to drop
# them instead.
filter_clearance: false

# US-only filter. When true, postings whose location clearly indicates a
# non-US country/city are dropped. Empty/unknown locations are kept (lots of
# remote-US or unspecified roles fall in that bucket).
us_only: true

# Drop postings older than this many days (when the source provides a date).
# 1 = only see postings from the last 24 hours — being an early applicant
# matters. Postings with unknown posting date are kept (community lists
# often omit it; their entries cycle out on their own).
# Set to 0 or remove to disable.
max_age_days: 1

# Location hot spots. Postings located here get a 📍 tag and sort to the top
# of their Discord section. Remote roles always stay. mode: prefer tags and
# reorders; mode: only drops everything outside the hot spots.
locations:
  mode: prefer
  hotspots:
    # DMV
    - "washington, dc"
    - "washington dc"
    - "washington, d"
    - "district of columbia"
    - ", dc"
    - "arlington, va"
    - "alexandria, va"
    - "tysons"
    - "mclean"
    - "reston"
    - "herndon"
    - "fairfax, va"
    - "northern virginia"
    - "bethesda"
    - "rockville"
    - "gaithersburg"
    - "germantown"
    - "silver spring"
    - "baltimore"
    # New York
    - "new york"
    # Bay Area
    - "san francisco"
    - "santa clara"

# Posting types are checked in ORDER — first match wins.
#
# Two paths to a Discord ping:
#   new_grad      — the title itself says it ("New Grad SWE", "Graduate
#                   Program", "Campus", "Class of 2026"). No AI needed.
#   verified_entry — the title has no signal either way ("Solutions
#                   Engineer", "Software Engineer I"). These go through the
#                   LLM verifier, which reads the full job description and
#                   only passes genuinely entry-level postings.
#
# Internships and co-ops are rejected everywhere (main.py) — this pipeline
# is full-time new-grad roles ONLY.
posting_types:
  - key: new_grad
    label: "🎓 New Grad (explicit title)"
    color: 0x3498DB
    requires_any:
      - new grad
      - new-grad
      - new graduate
      - graduate program
      - graduate engineer
      - graduate software
      - recent graduate
      - recent grad
      - university graduate
      - university grad
      - class of 2026
      - class of 2027
      - early career
      - early-career
      - campus

  - key: verified_entry
    label: "✅ Verified Entry-Level (AI read the JD)"
    color: 0x1ABC9C

# Role categories. Order = priority order in Discord output.
# A posting matches the FIRST category whose keywords appear in the title.
role_categories:
  - key: swe
    label: "💻 Software Engineering"
    keywords:
      - software engineer
      - software developer
      - swe
      - backend
      - frontend
      - front end
      - full stack
      - full-stack
      - fullstack
      - ios engineer
      - ios developer
      - android engineer
      - android developer
      - mobile engineer
      - web developer
      - member of technical staff
      - mts
      - forward deployed engineer
      - forward-deployed engineer
      - forward deployed
      - fde
      - deployment engineer
      - deployment strategist
      - field engineer

  - key: platform
    label: "🛠️ Platform / Infra / DevOps"
    keywords:
      - platform engineer
      - platform software engineer
      - infrastructure engineer
      - infrastructure software engineer
      - infra engineer
      - devops
      - sre
      - site reliability
      - cloud engineer
      - systems engineer
      - production engineer

  - key: sales_eng
    label: "🤝 Solutions / Sales Engineering"
    keywords:
      - solutions engineer
      - solution engineer
      - solutions engineering
      - sales engineer
      - sales engineering
      - technical sales engineer
      - technical sales
      - solutions consultant
      - solution consultant
      - pre-sales engineer
      - presales engineer
      - pre sales engineer

  - key: product
    label: "🧭 Product Management"
    keywords:
      - product manager
      - product management
      - apm
      - associate product
      - product analyst

  - key: consulting
    label: "🎯 Technology / Engineering Consulting"
    keywords:
      - technical consultant
      - technology consultant
      - engineering consultant
      - implementation consultant
      - technology analyst

# Reject postings whose title contains any of these substrings.
reject_if_title_contains:
  # Past seasons
  - spring 2025
  - summer 2025
  - fall 2025
  - winter 2025
  - spring 2024
  - summer 2024
  - fall 2024
  - winter 2024

# ---------- Entry-level verifier (llm_verify.py) ----------
#
# Works with any OpenAI-compatible chat/completions endpoint. Default is
# Google Gemini's free tier — key from https://aistudio.google.com
# (no credit card, no billing account). Free-tier limits (~10 req/min,
# a few hundred/day) are far above our volume (~1-3 calls/hour).
#
# Alternatives (change base_url + model):
#   OpenCode Zen: https://opencode.ai/zen/v1     model: mimo-v2.5-free
#   Groq:         https://api.groq.com/openai/v1 model: llama-3.3-70b-versatile
llm:
  enabled: true
  api_key_env: LLM_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  # Tried in order until one works; the first that answers is remembered
  # for the rest of the run. Specific versions first — the -latest alias
  # funnels all free-tier traffic to one endpoint and 503s under load.
  # Lite models are the least congested and handle classification fine.
  model:
    - gemini-3.5-flash
    - gemini-3.6-flash
    - gemini-flash-lite-latest
    - gemini-3.5-flash-lite
    - gemini-flash-latest
  # A posting passes only if the LLM says entry_level AND years_required <= max_years
  max_years: 2
  # Regex screen hard-rejects descriptions explicitly demanding >= this many
  # years of experience, before the LLM is ever called.
  hard_reject_years: 4
  # Postings per LLM call, and per run, to stay inside free tiers.
  batch_size: 8
  max_per_run: 100
  max_description_chars: 3500
  seconds_between_calls: 5
  # When the API key is missing or a call fails:
  #   lenient = keep postings the regex screen didn't hard-reject (tagged
  #             "not AI-verified"), strict = drop them.
  fallback: lenient


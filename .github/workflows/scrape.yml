name: Scrape jobs

on:
  schedule:
    # Every 30 minutes at off-peak offsets — being an early applicant matters,
    # so don't let a posting sit up to 59 minutes before pinging.
    - cron: "17,47 * * * *"
  workflow_dispatch: {}  # allow manual run from the Actions tab

# Never let a scheduled run and a manual run overlap (double-notify risk).
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit seen.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          if [[ -n "$(git status --porcelain seen.json verdicts.json jsearch_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json verdicts.json jsearch_state.json
            git commit -m "chore: update state files"
            git push
          else
            echo "No changes to state files"
          fi

      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 Job scraper run failed — check the Actions tab: https://github.com/armanbabazadeh6/Job-Web-Scrapper/actions"}' \
              "$DISCORD_WEBHOOK_URL" || true
          fi
